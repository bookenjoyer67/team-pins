[package]
name = "piggpin"
version = "0.0.1"
description = "P2P Encrypted Map Application"
authors = ["PiggPin"]
edition = "2021"

[lib]
name = "piggpin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
