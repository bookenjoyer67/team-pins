# piggPin Signal Relay Configuration
# Copy this to config.toml and edit for your server

[server]
port = 9000
bind_address = "127.0.0.1"

[rooms]
max_clients = 0
room_timeout_secs = 600
max_rooms = 1000

[rate_limit]
messages_per_sec = 20
connections_per_min = 30
ban_duration_secs = 3600

[security]
require_passwords = true
max_password_len = 128
max_room_len = 64
max_message_size = 10485760

[share]
max_shares = 1000
share_ttl_secs = 86400
max_share_ttl_secs = 86400
max_share_bytes = 209715200
allowed_origin = "https://app.piggpin.space"

[storage]
# Maximum pins per community (0 = unlimited). Oldest pins evicted when exceeded.
max_pins_per_community = 0
# Maximum pins per push delta (0 = unlimited). Set to 2000+ for large transit maps.
max_pins_per_push = 2000

[mqtt]
enabled = false
broker = "mqtt.meshtastic.org"
port = 8883
# Set via MQTT_USERNAME / MQTT_PASSWORD env vars, or fill in here
username = ""
password = ""
root_topic = "msh"
bridge_room = "mesh"
uplink_enabled = true

