[package]
name = "piggpin-signal"
version = "0.1.0"
edition = "2021"
description = "WebSocket signaling relay for piggPin with security features"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rumqttc = "0.25"
meshtastic_protobufs = "2.7"
prost = "0.13"
serialport = "4.6"
reticulum-rs-core = "0.2"
reticulum-rs-transport = "0.2"
ed25519-dalek = "2"
pbkdf2 = "0.12"
socket2 = "0.5"
