services:
  signal:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./signal-server/config.toml:/app/config.toml:ro
      - community_data:/app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true

volumes:
  community_data:
